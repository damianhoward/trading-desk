// The unified trading desk: a composing gateway that serves one tabbed front end and
// reverse-proxies the order book, risk, and trading services under a single origin. It owns
// no domain logic — each service stays a standalone, independently deployed app; this module
// only routes to them (streaming SSE through untouched) and serves the shell chrome.
plugins {
    id 'com.damianhoward.kotlin-conventions' version '0.5.4'
    id 'application'
}

group = 'com.damianhoward'
version = '1.0.0'

application {
    applicationName = 'trading-desk'
    mainClass = 'com.damianhoward.desk.web.DeskServerKt'
}

dependencies {
    testImplementation deps.hamcrest
    testImplementation deps.playwright
}

// Downloads the Chromium build DeskBrowserTest drives (a no-op when already present).
// Wired into test so `check` is self-sufficient — no bespoke CI install step.
tasks.register('installPlaywrightChromium', JavaExec) {
    classpath = configurations.testRuntimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', '--with-deps', 'chromium'
}

test.dependsOn installPlaywrightChromium

// Only the process entry point (DeskServerKt — main() binds the real port and blocks) is
// excluded, like a Spring Boot Application / CLI MainKt. The rest — routing, the reverse
// proxy, asset loading, upstream resolution — is exercised over a loopback HttpServer and counted.
coverageExcludes = ['**/web/DeskServerKt.class']