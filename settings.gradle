pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

// The shared version catalog: versions two or more repos genuinely share (see the
// build-conventions repo); application-specific dependencies stay in the build files.
dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
    versionCatalogs {
        create('deps') {
            from 'com.damianhoward:build-conventions-catalog:0.6.0'
        }
    }
}

rootProject.name = 'trading-desk'
